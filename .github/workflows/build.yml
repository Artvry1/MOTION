name: Build MOTION IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate
        working-directory: MOTION

      - name: Build app
        run: |
          xcodebuild \
            -project MOTION.xcodeproj \
            -scheme MOTION \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: MOTION

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MOTION.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload MOTION-unsigned.ipa
        working-directory: MOTION

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MOTION-unsigned-IPA
          path: MOTION/MOTION-unsigned.ipa

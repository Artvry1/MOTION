name: MOTION
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: MOTION
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: MOTION использует выбранные вами фотографии для создания обоев.
    PRODUCT_BUNDLE_IDENTIFIER: com.example.motionstudio
    CODE_SIGN_STYLE: Manual
targets:
  MOTION:
    type: application
    platform: iOS
    sources:
      - path: MOTION
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.motionstudio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
